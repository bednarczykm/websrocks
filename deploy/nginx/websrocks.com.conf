# websrocks.com — docelowy vhost (HTTPS).
# Na VPS: /etc/nginx/sites-available/websrocks.com (+ link w sites-enabled).
# Pliki strony: /var/www/websrocks — wgrywa je GitHub Actions (.github/workflows/deploy.yml).
# Certyfikat: certbot certonly --webroot (deploy/vps-cert.sh); odnowienia idą automatem
# (timer certbota), a deploy-hook przeładowuje nginx po odnowieniu.

# HTTP: tylko wyzwania Let's Encrypt, cała reszta → https://websrocks.com
server {
    listen 80;
    server_name websrocks.com www.websrocks.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://websrocks.com$request_uri;
    }
}

# https://www.websrocks.com → https://websrocks.com
server {
    listen 443 ssl http2;
    server_name www.websrocks.com;

    ssl_certificate     /etc/letsencrypt/live/websrocks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websrocks.com/privkey.pem;

    return 301 https://websrocks.com$request_uri;
}

# Strona
server {
    listen 443 ssl http2;
    server_name websrocks.com;

    ssl_certificate     /etc/letsencrypt/live/websrocks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websrocks.com/privkey.pem;

    access_log /var/log/nginx/websrocks.access.log;
    error_log  /var/log/nginx/websrocks.error.log;

    root  /var/www/websrocks;
    index index.html;

    gzip on;
    gzip_types text/css image/svg+xml;

    # Strona jest w pełni statyczna: bez skryptów, formularzy i zewnętrznych zasobów,
    # więc polityka CSP może być ścisła. Nowy skrypt/font/obrazek z innej domeny
    # = trzeba go tu dopisać, inaczej przeglądarka go zablokuje.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HTML zawsze świeży (no-cache); CSS i grafiki — cache na godzinę, bo nazwy
    # plików nie zmieniają się przy edycji. `expires` (a nie add_header) celowo:
    # add_header w location skasowałby odziedziczone nagłówki bezpieczeństwa.
    expires -1;
    location ~* \.(?:css|svg|jpe?g|png|webp|ico)$ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
