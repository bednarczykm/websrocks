# websrocks.com — WERSJA STARTOWA vhosta (tylko HTTP), zanim powstanie certyfikat.
# Na VPS: /etc/nginx/sites-available/websrocks.com
# Wgrywa ją deploy/vps-setup.sh (krok 1). deploy/vps-cert.sh (krok 2, po zmianie DNS)
# robi certyfikat i podmienia ją na docelową wersję z HTTPS: websrocks.com.conf.
# Znacznik, po którym skrypty rozpoznają tę wersję: WEBSROCKS-BOOTSTRAP

server {
    listen 80;
    server_name websrocks.com www.websrocks.com;

    access_log /var/log/nginx/websrocks.access.log;
    error_log  /var/log/nginx/websrocks.error.log;

    # Let's Encrypt (HTTP-01): certbot certonly --webroot -w /var/www/certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    root  /var/www/websrocks;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
